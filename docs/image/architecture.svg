<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-label="yrlwa.top 架构总览">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b8c6"/>
      <stop offset="60%" stop-color="#e79aae"/>
      <stop offset="100%" stop-color="#dcb98a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6b5f52" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cfc9c1"/>
    </marker>
    <style>
      .card    { fill: #ffffff; stroke: #e7e5e1; stroke-width: 1; }
      .card-hi { fill: #fdfaf6; stroke: #ecdfd0; stroke-width: 1; }
      .card-own{ fill: #f7fbf8; stroke: #d3e7db; stroke-width: 1; }
      .t   { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .h1  { font-size: 21px; font-weight: 700; fill: #1e1c19; }
      .h2  { font-size: 16px; font-weight: 650; fill: #1e1c19; }
      .p   { font-size: 12.5px; fill: #6f6862; }
      .m   { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; fill: #8a8178; }
      .col { font-size: 12px; font-weight: 700; fill: #a9a29a; letter-spacing: .12em; }
      .ln  { stroke: #cfc9c1; stroke-width: 1.6; fill: none; }
      .chip{ font-size: 11.5px; fill: #b9738a; font-weight: 600; }
    </style>
  </defs>

  <rect width="1080" height="620" rx="18" fill="#fcfcfb"/>
  <rect x="0.5" y="0.5" width="1079" height="619" rx="18" fill="none" stroke="#ecebe8"/>
  <rect x="0" y="0" width="1080" height="5" rx="2.5" fill="url(#line)"/>

  <text x="40" y="52" class="t h1">yrlwa.top 架构总览</text>
  <text x="40" y="76" class="t p">静态站点 + Cloudflare 边缘接口 + R2 存储 + 一台自建算力机</text>

  <!-- 列标题 -->
  <text x="40"  y="118" class="t col">客户端</text>
  <text x="360" y="118" class="t col">CLOUDFLARE PAGES</text>
  <text x="720" y="118" class="t col">后端与数据</text>

  <!-- 客户端 -->
  <g filter="url(#soft)">
    <rect x="40" y="132" width="250" height="104" rx="12" class="card"/>
  </g>
  <text x="60" y="162" class="t h2">浏览器</text>
  <text x="60" y="185" class="t p">Swup 无刷新跳转 · 深浅色主题</text>
  <text x="60" y="205" class="t p">壁纸模式 · 樱花 · 打字机</text>
  <text x="60" y="225" class="t p">Pagefind 全文搜索</text>

  <g filter="url(#soft)">
    <rect x="40" y="256" width="250" height="128" rx="12" class="card-own"/>
  </g>
  <rect x="40" y="256" width="4" height="128" rx="2" fill="#6fa98a"/>
  <text x="60" y="286" class="t h2">纯前端工具箱</text>
  <text x="60" y="309" class="t p">/tools/ · 零依赖 · 零上传</text>
  <text x="60" y="330" class="t m">tool-kit.js · ncm-core.js</text>
  <text x="60" y="349" class="t m">ncm-tool.js · img-tool.js</text>
  <text x="60" y="370" class="t p">文件只在浏览器内存里处理</text>

  <g filter="url(#soft)">
    <rect x="40" y="404" width="250" height="104" rx="12" class="card"/>
  </g>
  <text x="60" y="434" class="t h2">本地开发</text>
  <text x="60" y="457" class="t m">pnpm dev · localhost:4321</text>
  <text x="60" y="477" class="t p">改动提交后自动构建上线</text>
  <text x="60" y="497" class="t p">一般几分钟内可见</text>

  <!-- Cloudflare -->
  <g filter="url(#soft)">
    <rect x="360" y="132" width="290" height="104" rx="12" class="card-hi"/>
  </g>
  <rect x="360" y="132" width="4" height="104" rx="2" fill="#dcb98a"/>
  <text x="380" y="162" class="t h2">静态站点</text>
  <text x="380" y="185" class="t p">Astro 6 构建产物 dist/</text>
  <text x="380" y="205" class="t p">public/_headers 缓存策略</text>
  <text x="380" y="225" class="t p">工具页与脚本强校验</text>

  <g filter="url(#soft)">
    <rect x="360" y="256" width="290" height="194" rx="12" class="card-hi"/>
  </g>
  <rect x="360" y="256" width="4" height="194" rx="2" fill="#dcb98a"/>
  <text x="380" y="286" class="t h2">Functions 边缘接口</text>
  <text x="380" y="310" class="t m">/api/chat</text>
  <text x="470" y="310" class="t p">站内 AI 助手</text>
  <text x="380" y="334" class="t m">/api/stats</text>
  <text x="470" y="334" class="t p">访问量代理</text>
  <text x="380" y="358" class="t m">/api/auth/me</text>
  <text x="490" y="358" class="t p">口令登录态</text>
  <text x="380" y="382" class="t m">/music/*</text>
  <text x="452" y="382" class="t p">音频代理到 R2</text>
  <text x="380" y="406" class="t p">site-data.js 提供站点语料</text>
  <text x="380" y="430" class="t p">全部随 Pages 一起部署</text>

  <!-- 后端 -->
  <g filter="url(#soft)">
    <rect x="720" y="132" width="320" height="80" rx="12" class="card"/>
  </g>
  <text x="740" y="162" class="t h2">Cloudflare R2</text>
  <text x="740" y="186" class="t p">music-storage 桶 · FLAC 音频与封面</text>

  <g filter="url(#soft)">
    <rect x="720" y="227" width="320" height="80" rx="12" class="card"/>
  </g>
  <text x="740" y="257" class="t h2">SiliconFlow</text>
  <text x="740" y="281" class="t p">对话模型 + bge-m3 向量检索</text>

  <g filter="url(#soft)">
    <rect x="720" y="322" width="320" height="80" rx="12" class="card"/>
  </g>
  <text x="740" y="352" class="t h2">E5 算力机</text>
  <text x="740" y="376" class="t p">P100 16G · 对话 / 画图 / 编译</text>

  <g filter="url(#soft)">
    <rect x="720" y="417" width="320" height="80" rx="12" class="card"/>
  </g>
  <text x="740" y="447" class="t h2">统计 Worker</text>
  <text x="740" y="471" class="t p">总访问量与今日访问量</text>

  <!-- 连线 -->
  <path class="ln" d="M 290 184 L 354 184" marker-end="url(#arrow)"/>
  <text x="300" y="176" class="t chip">HTTPS</text>

  <path class="ln" d="M 650 300 C 686 300, 686 172, 714 172" marker-end="url(#arrow)"/>
  <path class="ln" d="M 650 320 C 690 320, 690 267, 714 267" marker-end="url(#arrow)"/>
  <path class="ln" d="M 650 360 C 690 360, 690 362, 714 362" marker-end="url(#arrow)"/>
  <path class="ln" d="M 650 400 C 690 400, 690 457, 714 457" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="40" y="536" width="1000" height="52" rx="10" fill="#fdfcfb" stroke="#ecebe8"/>
  <circle cx="64" cy="562" r="5" fill="#6fa98a"/>
  <text x="80" y="567" class="t p">工具箱的一切运算都在浏览器内存里完成，不经过任何服务器；其余功能由 Cloudflare 边缘与自建算力机提供。</text>
</svg>
